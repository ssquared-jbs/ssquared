<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Ssquared</title>

    <style>

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: Arial, sans-serif;
            background: linear-gradient(to bottom right, #f5f5f5, #e6e6e6);
            color: #222;
            min-height: 100vh;
        }

        header {
            background: #111;
            color: white;
            text-align: center;
            padding: 60px 20px;
        }

        header h1 {
            font-size: 4rem;
            margin-bottom: 15px;
        }

        header p {
            font-size: 1.2rem;
            opacity: 0.9;
        }

        .subjects-container {
            max-width: 1200px;
            margin: 60px auto;
            padding: 0 20px;

            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(300px, 1fr));
            gap: 30px;
        }

        .subject-card {
            background: white;
            border-radius: 20px;
            padding: 40px 30px;
            text-align: center;
            box-shadow: 0 6px 18px rgba(0,0,0,0.08);

            transition: transform 0.2s ease, box-shadow 0.2s ease;
        }

        .subject-card:hover {
            transform: translateY(-5px);
            box-shadow: 0 10px 24px rgba(0,0,0,0.12);
        }

        .subject-card h2 {
            font-size: 2rem;
            margin-bottom: 15px;
        }

        .subject-card p {
            margin-bottom: 30px;
            line-height: 1.6;
            color: #555;
        }

        .subject-button {
            display: inline-block;
            padding: 14px 28px;
            background: #111;
            color: white;
            text-decoration: none;
            border-radius: 12px;
            font-weight: bold;
            transition: background 0.2s ease;
        }

        .subject-button:hover {
            background: #333;
        }

        footer {
            margin-top: 80px;
            text-align: center;
            padding: 30px;
            color: #666;
            background: #e0e0e0;
        }

    </style>
</head>

<body>

    <header>
        <h1>Ssquared</h1>
        <p>Interactive revision platforms for modern learners.</p>
    </header>

    <section class="subjects-container">

        <div class="subject-card">
            <h2>Mandarin²</h2>

            <p>
                Interactive GCSE Mandarin revision featuring quizzes,
                flashcards, learning pages and revision games.
            </p>

            <a href="mandarin/index.html" class="subject-button">
                Open Mandarin²
            </a>
        </div>

        <div class="subject-card">
            <h2>Chemistry²</h2>

            <p>
                GCSE Chemistry revision platform currently in development.
            </p>

            <a href="#" class="subject-button">
                Coming Soon
            </a>
        </div>

    </section>

    <footer>
        © 2026 SSquared
    </footer>

</body>
</html>
