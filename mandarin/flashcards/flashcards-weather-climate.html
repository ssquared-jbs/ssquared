<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Weather and Climate Flashcards | Mandarin²</title>
  <link rel="stylesheet" href="../style.css">
</head>

<body>

<header>
  <h1>Mandarin²</h1>
  <p>Flashcards | Weather and Climate</p>
</header>

<main>

<div class="back-button">
  <a href="flashcards-unit-c.html">← Back to Unit C</a>
</div>

<section class="page-intro">
  <h2>Weather and Climate Flashcards</h2>
  <p>Tap to flip. Swipe left/right to move. Mark hard words to review later.</p>
</section>

<section class="flashcard-container">

  <div class="flashcard-scene" onclick="flipCard()" id="flashScene">
    <div class="flashcard flip-card" id="card">
      <div class="flashcard-face flashcard-front">
        <div id="frontContent"></div>
      </div>
      <div class="flashcard-face flashcard-back">
        <div id="backContent"></div>
      </div>
    </div>
  </div>

  <div class="flashcard-controls">
    <button onclick="prevCard()">← Previous</button>
    <button onclick="flipCard()">Flip Card</button>
    <button onclick="nextCard()">Next →</button>
  </div>

  <div class="flashcard-controls">
    <button onclick="markHard()">⭐ Mark Hard</button>
    <button onclick="reviewHard()">Review Hard</button>
    <button onclick="resetAll()">Reset</button>
  </div>

  <p class="flash-progress" id="progress"></p>

</section>

</main>

<footer>
  <p>Mandarin²</p>
</footer>

<script>
let originalCards = [
  {han:"天气", pin:"tiān qì", eng:"weather"},
  {han:"气候", pin:"qì hòu", eng:"climate"},
  {han:"今天", pin:"jīn tiān", eng:"today"},
  {han:"昨天", pin:"zuó tiān", eng:"yesterday"},
  {han:"明天", pin:"míng tiān", eng:"tomorrow"},
  {han:"现在", pin:"xiàn zài", eng:"now"},
  {han:"温度", pin:"wēn dù", eng:"temperature"},
  {han:"度", pin:"dù", eng:"degree"},
  {han:"热", pin:"rè", eng:"hot"},
  {han:"冷", pin:"lěng", eng:"cold"},
  {han:"暖和", pin:"nuǎn huo", eng:"warm"},
  {han:"凉快", pin:"liáng kuai", eng:"cool"},
  {han:"下雨", pin:"xià yǔ", eng:"to rain"},
  {han:"下雪", pin:"xià xuě", eng:"to snow"},
  {han:"刮风", pin:"guā fēng", eng:"windy"},
  {han:"大风", pin:"dà fēng", eng:"strong wind"},
  {han:"晴天", pin:"qíng tiān", eng:"sunny day"},
  {han:"多云", pin:"duō yún", eng:"cloudy"},
  {han:"阴天", pin:"yīn tiān", eng:"overcast"},
  {han:"雾", pin:"wù", eng:"fog"},
  {han:"空气", pin:"kōng qì", eng:"air"},
  {han:"湿", pin:"shī", eng:"humid"},
  {han:"干", pin:"gān", eng:"dry"},
  {han:"春天", pin:"chūn tiān", eng:"spring"},
  {han:"夏天", pin:"xià tiān", eng:"summer"},
  {han:"秋天", pin:"qiū tiān", eng:"autumn"},
  {han:"冬天", pin:"dōng tiān", eng:"winter"},
  {han:"季节", pin:"jì jié", eng:"season"},
  {han:"变化", pin:"biàn huà", eng:"change"},
  {han:"常常", pin:"cháng cháng", eng:"often"},
  {han:"有时候", pin:"yǒu shí hou", eng:"sometimes"},
  {han:"很", pin:"hěn", eng:"very"},
  {han:"太", pin:"tài", eng:"too"},
  {han:"今天很热", pin:"jīn tiān hěn rè", eng:"today is very hot"},
  {han:"冬天很冷", pin:"dōng tiān hěn lěng", eng:"winter is very cold"},
  {han:"夏天常常下雨", pin:"xià tiān cháng cháng xià yǔ", eng:"it often rains in summer"},
  {han:"我喜欢晴天", pin:"wǒ xǐ huān qíng tiān", eng:"I like sunny weather"}
];

let cards = [];
let hardCards = [];
let index = 0;
let flipped = false;
let startX = 0;
let endX = 0;

function shuffle(array) {
  for (let i = array.length - 1; i > 0; i--) {
    let j = Math.floor(Math.random() * (i + 1));
    [array[i], array[j]] = [array[j], array[i]];
  }
  return array;
}

function initCards() {
  cards = shuffle([...originalCards]);
  index = 0;
  flipped = false;
  updateCard();
}

function updateCard() {
  const card = cards[index];

  document.getElementById("frontContent").innerHTML = `
    <div class="han">${card.han}</div>
    <div class="pin">${card.pin}</div>
  `;

  document.getElementById("backContent").innerHTML = `
    <div class="eng">${card.eng}</div>
  `;

  document.getElementById("card").classList.toggle("is-flipped", flipped);
  document.getElementById("progress").textContent =
    `Card ${index + 1} of ${cards.length} | Hard cards: ${hardCards.length}`;

  setTimeout(fitText, 0);
}

function fitText() {
  const elements = document.querySelectorAll(".han, .eng");

  elements.forEach(el => {
    el.style.fontSize = "";
    let size = parseFloat(window.getComputedStyle(el).fontSize);

    while (el.scrollWidth > el.clientWidth && size > 24) {
      size -= 2;
      el.style.fontSize = size + "px";
    }
  });
}

function flipCard() {
  flipped = !flipped;
  updateCard();
}

function animateCard(direction, callback) {
  const scene = document.getElementById("flashScene");

  scene.classList.remove("flashcard-slide-left", "flashcard-slide-right");
  void scene.offsetWidth;

  scene.classList.add(direction === "next" ? "flashcard-slide-left" : "flashcard-slide-right");

  setTimeout(function() {
    callback();
    scene.classList.remove("flashcard-slide-left", "flashcard-slide-right");
  }, 220);
}

function nextCard() {
  animateCard("next", function() {
    index = (index + 1) % cards.length;
    flipped = false;
    updateCard();
  });
}

function prevCard() {
  animateCard("prev", function() {
    index = (index - 1 + cards.length) % cards.length;
    flipped = false;
    updateCard();
  });
}

function markHard() {
  const current = cards[index];
  const exists = hardCards.some(card => card.han === current.han);
  if (!exists) hardCards.push(current);
  nextCard();
}

function reviewHard() {
  if (hardCards.length === 0) {
    alert("No hard cards yet.");
    return;
  }

  cards = shuffle([...hardCards]);
  index = 0;
  flipped = false;
  updateCard();
}

function resetAll() {
  hardCards = [];
  initCards();
}

const scene = document.getElementById("flashScene");

scene.addEventListener("touchstart", e => startX = e.touches[0].clientX);
scene.addEventListener("touchend", e => {
  endX = e.changedTouches[0].clientX;
  handleSwipe();
});

scene.addEventListener("mousedown", e => startX = e.clientX);
scene.addEventListener("mouseup", e => {
  endX = e.clientX;
  handleSwipe();
});

function handleSwipe() {
  const diff = endX - startX;

  if (Math.abs(diff) > 60) {
    if (diff < 0) nextCard();
    else prevCard();
  }
}

initCards();
</script>

</body>
</html>
