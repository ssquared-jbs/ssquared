  <meta charset="UTF-8">
  <title>Health and Fitness Flashcards | Mandarin²</title>
  <link rel="stylesheet" href="../style.css">
</head>

<body>

<header>
  <h1>Mandarin²</h1>
  <p>Flashcards | Health and Fitness</p>
</header>

<main>

<div class="back-button">
  <a href="flashcards-unit-b.html">← Back to Unit B</a>
</div>

<section class="page-intro">
  <h2>Health and Fitness Flashcards</h2>
  <p>Tap to flip. Swipe left/right to move. Mark hard words to review later.</p>
</section>

<section class="flashcard-container">

  <div class="flashcard-scene" onclick="flipCard()" id="flashScene">
    <div class="flashcard flip-card" id="card">
      <div class="flashcard-face flashcard-front">
        <div id="frontContent"></div>
      </div>
      <div class="flashcard-face flashcard-back">
        <div id="backContent"></div>
      </div>
    </div>
  </div>

  <div class="flashcard-controls">
    <button onclick="prevCard()">← Previous</button>
    <button onclick="flipCard()">Flip Card</button>
    <button onclick="nextCard()">Next →</button>
  </div>

  <div class="flashcard-controls">
    <button onclick="markHard()">⭐ Mark Hard</button>
    <button onclick="reviewHard()">Review Hard</button>
    <button onclick="resetAll()">Reset</button>
  </div>

  <p class="flash-progress" id="progress"></p>

</section>

</main>

<footer>
  <p>Mandarin²</p>
</footer>

<script>
let originalCards = [
  {han:"健康", pin:"jiàn kāng", eng:"health"},
  {han:"生病", pin:"shēng bìng", eng:"to be ill"},
  {han:"病", pin:"bìng", eng:"illness"},
  {han:"医生", pin:"yī shēng", eng:"doctor"},
  {han:"医院", pin:"yī yuàn", eng:"hospital"},
  {han:"吃药", pin:"chī yào", eng:"to take medicine"},
  {han:"休息", pin:"xiū xi", eng:"to rest"},
  {han:"发烧", pin:"fā shāo", eng:"to have a fever"},
  {han:"头痛", pin:"tóu tòng", eng:"headache"},
  {han:"肚子痛", pin:"dù zi tòng", eng:"stomach ache"},
  {han:"感冒", pin:"gǎn mào", eng:"cold"},
  {han:"咳嗽", pin:"ké sou", eng:"to cough"},
  {han:"运动", pin:"yùn dòng", eng:"exercise"},
  {han:"跑步", pin:"pǎo bù", eng:"to run"},
  {han:"游泳", pin:"yóu yǒng", eng:"to swim"},
  {han:"踢足球", pin:"tī zú qiú", eng:"to play football"},
  {han:"打篮球", pin:"dǎ lán qiú", eng:"to play basketball"},
  {han:"骑自行车", pin:"qí zì xíng chē", eng:"to ride a bike"},
  {han:"锻炼", pin:"duàn liàn", eng:"to exercise/train"},
  {han:"保持健康", pin:"bǎo chí jiàn kāng", eng:"to keep healthy"},
  {han:"饮食", pin:"yǐn shí", eng:"diet"},
  {han:"多吃蔬菜", pin:"duō chī shū cài", eng:"eat more vegetables"},
  {han:"少吃糖", pin:"shǎo chī táng", eng:"eat less sugar"},
  {han:"喝水", pin:"hē shuǐ", eng:"to drink water"},
  {han:"睡觉", pin:"shuì jiào", eng:"to sleep"},
  {han:"早睡", pin:"zǎo shuì", eng:"sleep early"},
  {han:"累", pin:"lèi", eng:"tired"},
  {han:"舒服", pin:"shū fu", eng:"comfortable / feel well"},
  {han:"不舒服", pin:"bù shū fu", eng:"unwell"},
  {han:"应该", pin:"yīng gāi", eng:"should"},
  {han:"我觉得运动很重要", pin:"wǒ jué de yùn dòng hěn zhòng yào", eng:"I think exercise is important"},
  {han:"多运动对身体好", pin:"duō yùn dòng duì shēn tǐ hǎo", eng:"more exercise is good for the body"}
];

let cards = [];
let hardCards = [];
let index = 0;
let flipped = false;
let startX = 0;
let endX = 0;

function shuffle(array) {
  for (let i = array.length - 1; i > 0; i--) {
    let j = Math.floor(Math.random() * (i + 1));
    [array[i], array[j]] = [array[j], array[i]];
  }
  return array;
}

function initCards() {
  cards = shuffle([...originalCards]);
  index = 0;
  flipped = false;
  updateCard();
}

function updateCard() {
  const card = cards[index];

  document.getElementById("frontContent").innerHTML = `
    <div class="han">${card.han}</div>
    <div class="pin">${card.pin}</div>
  `;

  document.getElementById("backContent").innerHTML = `
    <div class="eng">${card.eng}</div>
  `;

  document.getElementById("card").classList.toggle("is-flipped", flipped);
  document.getElementById("progress").textContent =
    `Card ${index + 1} of ${cards.length} | Hard cards: ${hardCards.length}`;

  setTimeout(fitText, 0);
}

function fitText() {
  const elements = document.querySelectorAll(".han, .eng");

  elements.forEach(el => {
    let size = parseFloat(window.getComputedStyle(el).fontSize);
    while (el.scrollWidth > el.clientWidth && size > 24) {
      size -= 2;
      el.style.fontSize = size + "px";
    }
  });
}

function flipCard() {
  flipped = !flipped;
  updateCard();
}

function animateCard(direction, callback) {
  const scene = document.getElementById("flashScene");

  scene.classList.remove("flashcard-slide-left", "flashcard-slide-right");
  void scene.offsetWidth;

  scene.classList.add(direction === "next" ? "flashcard-slide-left" : "flashcard-slide-right");

  setTimeout(function() {
    callback();
    scene.classList.remove("flashcard-slide-left", "flashcard-slide-right");
  }, 220);
}

function nextCard() {
  animateCard("next", function() {
    index = (index + 1) % cards.length;
    flipped = false;
    updateCard();
  });
}

function prevCard() {
  animateCard("prev", function() {
    index = (index - 1 + cards.length) % cards.length;
    flipped = false;
    updateCard();
  });
}

function markHard() {
  const current = cards[index];
  const exists = hardCards.some(card => card.han === current.han);
  if (!exists) hardCards.push(current);
  nextCard();
}

function reviewHard() {
  if (hardCards.length === 0) {
    alert("No hard cards yet.");
    return;
  }
  cards = shuffle([...hardCards]);
  index = 0;
  flipped = false;
  updateCard();
}

function resetAll() {
  hardCards = [];
  initCards();
}

const scene = document.getElementById("flashScene");

scene.addEventListener("touchstart", e => startX = e.touches[0].clientX);
scene.addEventListener("touchend", e => {
  endX = e.changedTouches[0].clientX;
  handleSwipe();
});
scene.addEventListener("mousedown", e => startX = e.clientX);
scene.addEventListener("mouseup", e => {
  endX = e.clientX;
  handleSwipe();
});

function handleSwipe() {
  const diff = endX - startX;
  if (Math.abs(diff) > 60) {
    if (diff < 0) nextCard();
    else prevCard();
  }
}

initCards();
</script>

</body>
</html>
