  <meta charset="UTF-8">
  <title>Home Life Flashcards | Mandarin²</title>
  <link rel="stylesheet" href="../style.css">
</head>

<body>

<header>
  <h1>Mandarin²</h1>
  <p>Flashcards | Home Life</p>
</header>

<main>

<div class="back-button">
  <a href="flashcards-unit-b.html">← Back to Unit B</a>
</div>

<section class="page-intro">
  <h2>Home Life Flashcards</h2>
  <p>Tap to flip. Swipe left/right to move. Mark hard words to review later.</p>
</section>

<section class="flashcard-container">

  <div class="flashcard-scene" onclick="flipCard()" id="flashScene">
    <div class="flashcard flip-card" id="card">
      <div class="flashcard-face flashcard-front">
        <div id="frontContent"></div>
      </div>
      <div class="flashcard-face flashcard-back">
        <div id="backContent"></div>
      </div>
    </div>
  </div>

  <div class="flashcard-controls">
    <button onclick="prevCard()">← Previous</button>
    <button onclick="flipCard()">Flip Card</button>
    <button onclick="nextCard()">Next →</button>
  </div>

  <div class="flashcard-controls">
    <button onclick="markHard()">⭐ Mark Hard</button>
    <button onclick="reviewHard()">Review Hard</button>
    <button onclick="resetAll()">Reset</button>
  </div>

  <p class="flash-progress" id="progress"></p>

</section>

</main>

<footer>
  <p>Mandarin²</p>
</footer>

<script>
let originalCards = [
  {han:"家", pin:"jiā", eng:"home"},
  {han:"房子", pin:"fáng zi", eng:"house"},
  {han:"公寓", pin:"gōng yù", eng:"flat / apartment"},
  {han:"房间", pin:"fáng jiān", eng:"room"},
  {han:"卧室", pin:"wò shì", eng:"bedroom"},
  {han:"客厅", pin:"kè tīng", eng:"living room"},
  {han:"厨房", pin:"chú fáng", eng:"kitchen"},
  {han:"卫生间", pin:"wèi shēng jiān", eng:"bathroom / toilet"},
  {han:"花园", pin:"huā yuán", eng:"garden"},
  {han:"楼上", pin:"lóu shàng", eng:"upstairs"},
  {han:"楼下", pin:"lóu xià", eng:"downstairs"},
  {han:"门", pin:"mén", eng:"door"},
  {han:"窗户", pin:"chuāng hu", eng:"window"},
  {han:"床", pin:"chuáng", eng:"bed"},
  {han:"桌子", pin:"zhuō zi", eng:"table / desk"},
  {han:"椅子", pin:"yǐ zi", eng:"chair"},
  {han:"沙发", pin:"shā fā", eng:"sofa"},
  {han:"电视", pin:"diàn shì", eng:"television"},
  {han:"电脑", pin:"diàn nǎo", eng:"computer"},
  {han:"冰箱", pin:"bīng xiāng", eng:"fridge"},
  {han:"洗衣机", pin:"xǐ yī jī", eng:"washing machine"},
  {han:"打扫", pin:"dǎ sǎo", eng:"to clean"},
  {han:"整理房间", pin:"zhěng lǐ fáng jiān", eng:"to tidy the room"},
  {han:"洗碗", pin:"xǐ wǎn", eng:"to wash dishes"},
  {han:"做饭", pin:"zuò fàn", eng:"to cook"},
  {han:"帮助", pin:"bāng zhù", eng:"to help"},
  {han:"家务", pin:"jiā wù", eng:"housework"},
  {han:"干净", pin:"gān jìng", eng:"clean"},
  {han:"安静", pin:"ān jìng", eng:"quiet"},
  {han:"舒服", pin:"shū fu", eng:"comfortable"},
  {han:"大", pin:"dà", eng:"big"},
  {han:"小", pin:"xiǎo", eng:"small"},
  {han:"漂亮", pin:"piào liang", eng:"pretty"},
  {han:"方便", pin:"fāng biàn", eng:"convenient"},
  {han:"我家有三个卧室", pin:"wǒ jiā yǒu sān gè wò shì", eng:"my home has three bedrooms"},
  {han:"我每天整理房间", pin:"wǒ měi tiān zhěng lǐ fáng jiān", eng:"I tidy my room every day"}
];

let cards = [];
let hardCards = [];
let index = 0;
let flipped = false;
let startX = 0;
let endX = 0;

function shuffle(array) {
  for (let i = array.length - 1; i > 0; i--) {
    let j = Math.floor(Math.random() * (i + 1));
    [array[i], array[j]] = [array[j], array[i]];
  }
  return array;
}

function initCards() {
  cards = shuffle([...originalCards]);
  index = 0;
  flipped = false;
  updateCard();
}

function updateCard() {
  const card = cards[index];

  document.getElementById("frontContent").innerHTML = `
    <div class="han">${card.han}</div>
    <div class="pin">${card.pin}</div>
  `;

  document.getElementById("backContent").innerHTML = `
    <div class="eng">${card.eng}</div>
  `;

  document.getElementById("card").classList.toggle("is-flipped", flipped);
  document.getElementById("progress").textContent =
    `Card ${index + 1} of ${cards.length} | Hard cards: ${hardCards.length}`;

  setTimeout(fitText, 0);
}

function fitText() {
  const elements = document.querySelectorAll(".han, .eng");

  elements.forEach(el => {
    el.style.fontSize = "";
    let size = parseFloat(window.getComputedStyle(el).fontSize);

    while (el.scrollWidth > el.clientWidth && size > 24) {
      size -= 2;
      el.style.fontSize = size + "px";
    }
  });
}

function flipCard() {
  flipped = !flipped;
  updateCard();
}

function animateCard(direction, callback) {
  const scene = document.getElementById("flashScene");

  scene.classList.remove("flashcard-slide-left", "flashcard-slide-right");
  void scene.offsetWidth;

  scene.classList.add(direction === "next" ? "flashcard-slide-left" : "flashcard-slide-right");

  setTimeout(function() {
    callback();
    scene.classList.remove("flashcard-slide-left", "flashcard-slide-right");
  }, 220);
}

function nextCard() {
  animateCard("next", function() {
    index = (index + 1) % cards.length;
    flipped = false;
    updateCard();
  });
}

function prevCard() {
  animateCard("prev", function() {
    index = (index - 1 + cards.length) % cards.length;
    flipped = false;
    updateCard();
  });
}

function markHard() {
  const current = cards[index];
  const exists = hardCards.some(card => card.han === current.han);
  if (!exists) hardCards.push(current);
  nextCard();
}

function reviewHard() {
  if (hardCards.length === 0) {
    alert("No hard cards yet.");
    return;
  }
  cards = shuffle([...hardCards]);
  index = 0;
  flipped = false;
  updateCard();
}

function resetAll() {
  hardCards = [];
  initCards();
}

const scene = document.getElementById("flashScene");

scene.addEventListener("touchstart", e => startX = e.touches[0].clientX);
scene.addEventListener("touchend", e => {
  endX = e.changedTouches[0].clientX;
  handleSwipe();
});

scene.addEventListener("mousedown", e => startX = e.clientX);
scene.addEventListener("mouseup", e => {
  endX = e.clientX;
  handleSwipe();
});

function handleSwipe() {
  const diff = endX - startX;

  if (Math.abs(diff) > 60) {
    if (diff < 0) nextCard();
    else prevCard();
  }
}

initCards();
</script>

</body>
</html>
