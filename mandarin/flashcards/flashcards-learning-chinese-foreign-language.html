<html lang="en">

  <meta charset="UTF-8">
  <title>Learning Chinese as a Foreign Language Flashcards | Mandarin²</title>
  <link rel="stylesheet" href="../style.css">
</head>

<body>

<header>
  <h1>Mandarin²</h1>
  <p>Flashcards | Learning Chinese as a Foreign Language</p>
</header>

<main>

<div class="back-button">
  <a href="flashcards-unit-e.html">← Back to Unit E</a>
</div>

<section class="page-intro">
  <h2>Learning Chinese as a Foreign Language Flashcards</h2>
  <p>Tap to flip. Swipe left/right to move. Mark hard words to review later.</p>
</section>

<section class="flashcard-container">

  <div class="flashcard-scene" onclick="flipCard()" id="flashScene">
    <div class="flashcard flip-card" id="card">
      <div class="flashcard-face flashcard-front">
        <div id="frontContent"></div>
      </div>
      <div class="flashcard-face flashcard-back">
        <div id="backContent"></div>
      </div>
    </div>
  </div>

  <div class="flashcard-controls">
    <button onclick="prevCard()">← Previous</button>
    <button onclick="flipCard()">Flip Card</button>
    <button onclick="nextCard()">Next →</button>
  </div>

  <div class="flashcard-controls">
    <button onclick="markHard()">⭐ Mark Hard</button>
    <button onclick="reviewHard()">Review Hard</button>
    <button onclick="resetAll()">Reset</button>
  </div>

  <p class="flash-progress" id="progress"></p>

</section>

</main>

<footer>
  <p>Mandarin²</p>
</footer>

<script>
let originalCards = [
  {han:"中文", pin:"zhōng wén", eng:"Chinese language"},
  {han:"汉语", pin:"hàn yǔ", eng:"Mandarin Chinese"},
  {han:"外语", pin:"wài yǔ", eng:"foreign language"},
  {han:"学习", pin:"xué xí", eng:"to study / learn"},
  {han:"复习", pin:"fù xí", eng:"to revise"},
  {han:"练习", pin:"liàn xí", eng:"to practise"},
  {han:"听力", pin:"tīng lì", eng:"listening"},
  {han:"口语", pin:"kǒu yǔ", eng:"speaking"},
  {han:"阅读", pin:"yuè dú", eng:"reading"},
  {han:"写作", pin:"xiě zuò", eng:"writing"},
  {han:"生词", pin:"shēng cí", eng:"new vocabulary"},
  {han:"语法", pin:"yǔ fǎ", eng:"grammar"},
  {han:"汉字", pin:"hàn zì", eng:"Chinese characters"},
  {han:"拼音", pin:"pīn yīn", eng:"pinyin"},
  {han:"发音", pin:"fā yīn", eng:"pronunciation"},
  {han:"声调", pin:"shēng diào", eng:"tones"},
  {han:"句子", pin:"jù zi", eng:"sentence"},
  {han:"课文", pin:"kè wén", eng:"text / passage"},
  {han:"考试", pin:"kǎo shì", eng:"exam"},
  {han:"困难", pin:"kùn nan", eng:"difficult"},
  {han:"容易", pin:"róng yì", eng:"easy"},
  {han:"有用", pin:"yǒu yòng", eng:"useful"},
  {han:"有意思", pin:"yǒu yì si", eng:"interesting"},
  {han:"进步", pin:"jìn bù", eng:"progress / to improve"},
  {han:"提高", pin:"tí gāo", eng:"to improve"},
  {han:"每天", pin:"měi tiān", eng:"every day"},
  {han:"经常", pin:"jīng cháng", eng:"often"},
  {han:"如果", pin:"rú guǒ", eng:"if"},
  {han:"就", pin:"jiù", eng:"then"},
  {han:"因为", pin:"yīn wèi", eng:"because"},
  {han:"所以", pin:"suǒ yǐ", eng:"so / therefore"},
  {han:"虽然", pin:"suī rán", eng:"although"},
  {han:"但是", pin:"dàn shì", eng:"but"},
  {han:"我每天学习中文", pin:"wǒ měi tiān xué xí zhōng wén", eng:"I study Chinese every day"},
  {han:"我觉得汉字很难", pin:"wǒ jué de hàn zì hěn nán", eng:"I think Chinese characters are difficult"},
  {han:"听力和口语很重要", pin:"tīng lì hé kǒu yǔ hěn zhòng yào", eng:"listening and speaking are important"},
  {han:"如果每天复习，就会进步", pin:"rú guǒ měi tiān fù xí, jiù huì jìn bù", eng:"if you revise every day, you will improve"},
  {han:"虽然中文很难，但是很有用", pin:"suī rán zhōng wén hěn nán, dàn shì hěn yǒu yòng", eng:"although Chinese is difficult, it is useful"}
];

let cards = [];
let hardCards = [];
let index = 0;
let flipped = false;
let startX = 0;
let endX = 0;

function shuffle(array) {
  for (let i = array.length - 1; i > 0; i--) {
    let j = Math.floor(Math.random() * (i + 1));
    [array[i], array[j]] = [array[j], array[i]];
  }
  return array;
}

function initCards() {
  cards = shuffle([...originalCards]);
  index = 0;
  flipped = false;
  updateCard();
}

function updateCard() {
  const card = cards[index];

  document.getElementById("frontContent").innerHTML = `
    <div class="han">${card.han}</div>
    <div class="pin">${card.pin}</div>
  `;

  document.getElementById("backContent").innerHTML = `
    <div class="eng">${card.eng}</div>
  `;

  document.getElementById("card").classList.toggle("is-flipped", flipped);
  document.getElementById("progress").textContent =
    `Card ${index + 1} of ${cards.length} | Hard cards: ${hardCards.length}`;

  setTimeout(fitText, 0);
}

function fitText() {
  const elements = document.querySelectorAll(".han, .eng");

  elements.forEach(el => {
    el.style.fontSize = "";
    let size = parseFloat(window.getComputedStyle(el).fontSize);

    while (el.scrollWidth > el.clientWidth && size > 24) {
      size -= 2;
      el.style.fontSize = size + "px";
    }
  });
}

function flipCard() {
  flipped = !flipped;
  updateCard();
}

function animateCard(direction, callback) {
  const scene = document.getElementById("flashScene");

  scene.classList.remove("flashcard-slide-left", "flashcard-slide-right");
  void scene.offsetWidth;

  scene.classList.add(direction === "next" ? "flashcard-slide-left" : "flashcard-slide-right");

  setTimeout(function() {
    callback();
    scene.classList.remove("flashcard-slide-left", "flashcard-slide-right");
  }, 220);
}

function nextCard() {
  animateCard("next", function() {
    index = (index + 1) % cards.length;
    flipped = false;
    updateCard();
  });
}

function prevCard() {
  animateCard("prev", function() {
    index = (index - 1 + cards.length) % cards.length;
    flipped = false;
    updateCard();
  });
}

function markHard() {
  const current = cards[index];
  const exists = hardCards.some(card => card.han === current.han);
  if (!exists) hardCards.push(current);
  nextCard();
}

function reviewHard() {
  if (hardCards.length === 0) {
    alert("No hard cards yet.");
    return;
  }

  cards = shuffle([...hardCards]);
  index = 0;
  flipped = false;
  updateCard();
}

function resetAll() {
  hardCards = [];
  initCards();
}

const scene = document.getElementById("flashScene");

scene.addEventListener("touchstart", e => startX = e.touches[0].clientX);
scene.addEventListener("touchend", e => {
  endX = e.changedTouches[0].clientX;
  handleSwipe();
});

scene.addEventListener("mousedown", e => startX = e.clientX);
scene.addEventListener("mouseup", e => {
  endX = e.clientX;
  handleSwipe();
});

function handleSwipe() {
  const diff = endX - startX;

  if (Math.abs(diff) > 60) {
    if (diff < 0) nextCard();
    else prevCard();
  }
}

initCards();
</script>

</body>
</html>
