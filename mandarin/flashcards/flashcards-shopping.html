<html lang="en">

  <meta charset="UTF-8">
  <title>Shopping Flashcards | Mandarin²</title>
  <link rel="stylesheet" href="../style.css">
</head>

<body>

<header>
  <h1>Mandarin²</h1>
  <p>Flashcards | Shopping</p>
</header>

<main>

<div class="back-button">
  <a href="flashcards-unit-b.html">← Back to Unit B</a>
</div>

<section class="page-intro">
  <h2>Shopping Flashcards</h2>
  <p>Tap to flip. Swipe left/right to move. Mark hard words to review later.</p>
</section>

<section class="flashcard-container">

  <div class="flashcard-scene" onclick="flipCard()" id="flashScene">
    <div class="flashcard flip-card" id="card">
      <div class="flashcard-face flashcard-front">
        <div id="frontContent"></div>
      </div>
      <div class="flashcard-face flashcard-back">
        <div id="backContent"></div>
      </div>
    </div>
  </div>

  <div class="flashcard-controls">
    <button onclick="prevCard()">← Previous</button>
    <button onclick="flipCard()">Flip Card</button>
    <button onclick="nextCard()">Next →</button>
  </div>

  <div class="flashcard-controls">
    <button onclick="markHard()">⭐ Mark Hard</button>
    <button onclick="reviewHard()">Review Hard</button>
    <button onclick="resetAll()">Reset</button>
  </div>

  <p class="flash-progress" id="progress"></p>

</section>

</main>

<footer>
  <p>Mandarin²</p>
</footer>

<script>
let originalCards = [
  {han:"买东西", pin:"mǎi dōng xi", eng:"to go shopping / buy things"},
  {han:"商店", pin:"shāng diàn", eng:"shop"},
  {han:"超市", pin:"chāo shì", eng:"supermarket"},
  {han:"市场", pin:"shì chǎng", eng:"market"},
  {han:"商场", pin:"shāng chǎng", eng:"shopping centre"},
  {han:"百货公司", pin:"bǎi huò gōng sī", eng:"department store"},
  {han:"书店", pin:"shū diàn", eng:"bookshop"},
  {han:"药店", pin:"yào diàn", eng:"pharmacy"},
  {han:"店员", pin:"diàn yuán", eng:"shop assistant"},
  {han:"顾客", pin:"gù kè", eng:"customer"},
  {han:"钱", pin:"qián", eng:"money"},
  {han:"多少钱", pin:"duō shǎo qián", eng:"how much money"},
  {han:"价格", pin:"jià gé", eng:"price"},
  {han:"便宜", pin:"pián yi", eng:"cheap"},
  {han:"贵", pin:"guì", eng:"expensive"},
  {han:"太贵了", pin:"tài guì le", eng:"too expensive"},
  {han:"打折", pin:"dǎ zhé", eng:"discount / to give a discount"},
  {han:"半价", pin:"bàn jià", eng:"half price"},
  {han:"现金", pin:"xiàn jīn", eng:"cash"},
  {han:"信用卡", pin:"xìn yòng kǎ", eng:"credit card"},
  {han:"付款", pin:"fù kuǎn", eng:"to pay"},
  {han:"买单", pin:"mǎi dān", eng:"to pay the bill"},
  {han:"收据", pin:"shōu jù", eng:"receipt"},
  {han:"找钱", pin:"zhǎo qián", eng:"change"},
  {han:"试一试", pin:"shì yi shì", eng:"to try it"},
  {han:"大小", pin:"dà xiǎo", eng:"size"},
  {han:"颜色", pin:"yán sè", eng:"colour"},
  {han:"合适", pin:"hé shì", eng:"suitable / fits"},
  {han:"质量", pin:"zhì liàng", eng:"quality"},
  {han:"退货", pin:"tuì huò", eng:"to return goods"},
  {han:"换", pin:"huàn", eng:"to exchange / change"},
  {han:"网上购物", pin:"wǎng shàng gòu wù", eng:"online shopping"},
  {han:"方便", pin:"fāng biàn", eng:"convenient"},
  {han:"不方便", pin:"bù fāng biàn", eng:"inconvenient"},
  {han:"喜欢购物", pin:"xǐ huān gòu wù", eng:"to like shopping"},
  {han:"我想买这件衣服", pin:"wǒ xiǎng mǎi zhè jiàn yī fu", eng:"I want to buy this item of clothing"},
  {han:"这个多少钱？", pin:"zhè ge duō shǎo qián", eng:"how much is this?"},
  {han:"可以便宜一点吗？", pin:"kě yǐ pián yi yì diǎn ma", eng:"can it be a bit cheaper?"},
  {han:"我觉得网上购物很方便", pin:"wǒ jué de wǎng shàng gòu wù hěn fāng biàn", eng:"I think online shopping is very convenient"}
];

let cards = [];
let hardCards = [];
let index = 0;
let flipped = false;
let startX = 0;
let endX = 0;

function shuffle(array) {
  for (let i = array.length - 1; i > 0; i--) {
    let j = Math.floor(Math.random() * (i + 1));
    [array[i], array[j]] = [array[j], array[i]];
  }
  return array;
}

function initCards() {
  cards = shuffle([...originalCards]);
  index = 0;
  flipped = false;
  updateCard();
}

function updateCard() {
  const card = cards[index];

  document.getElementById("frontContent").innerHTML = `
    <div class="han">${card.han}</div>
    <div class="pin">${card.pin}</div>
  `;

  document.getElementById("backContent").innerHTML = `
    <div class="eng">${card.eng}</div>
  `;

  document.getElementById("card").classList.toggle("is-flipped", flipped);
  document.getElementById("progress").textContent =
    `Card ${index + 1} of ${cards.length} | Hard cards: ${hardCards.length}`;

  setTimeout(fitText, 0);
}

function fitText() {
  const elements = document.querySelectorAll(".han, .eng");

  elements.forEach(el => {
    el.style.fontSize = "";
    let size = parseFloat(window.getComputedStyle(el).fontSize);

    while (el.scrollWidth > el.clientWidth && size > 24) {
      size -= 2;
      el.style.fontSize = size + "px";
    }
  });
}

function flipCard() {
  flipped = !flipped;
  updateCard();
}

function animateCard(direction, callback) {
  const scene = document.getElementById("flashScene");

  scene.classList.remove("flashcard-slide-left", "flashcard-slide-right");
  void scene.offsetWidth;

  scene.classList.add(direction === "next" ? "flashcard-slide-left" : "flashcard-slide-right");

  setTimeout(function() {
    callback();
    scene.classList.remove("flashcard-slide-left", "flashcard-slide-right");
  }, 220);
}

function nextCard() {
  animateCard("next", function() {
    index = (index + 1) % cards.length;
    flipped = false;
    updateCard();
  });
}

function prevCard() {
  animateCard("prev", function() {
    index = (index - 1 + cards.length) % cards.length;
    flipped = false;
    updateCard();
  });
}

function markHard() {
  const current = cards[index];
  const exists = hardCards.some(card => card.han === current.han);
  if (!exists) hardCards.push(current);
  nextCard();
}

function reviewHard() {
  if (hardCards.length === 0) {
    alert("No hard cards yet.");
    return;
  }
  cards = shuffle([...hardCards]);
  index = 0;
  flipped = false;
  updateCard();
}

function resetAll() {
  hardCards = [];
  initCards();
}

const scene = document.getElementById("flashScene");

scene.addEventListener("touchstart", e => startX = e.touches[0].clientX);
scene.addEventListener("touchend", e => {
  endX = e.changedTouches[0].clientX;
  handleSwipe();
});

scene.addEventListener("mousedown", e => startX = e.clientX);
scene.addEventListener("mouseup", e => {
  endX = e.clientX;
  handleSwipe();
});

function handleSwipe() {
  const diff = endX - startX;

  if (Math.abs(diff) > 60) {
    if (diff < 0) nextCard();
    else prevCard();
  }
}

initCards();
</script>

</body>
</html>
