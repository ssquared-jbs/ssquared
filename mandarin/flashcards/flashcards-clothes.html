  <meta charset="UTF-8">
  <title>Clothes Flashcards | Mandarin²</title>
  <link rel="stylesheet" href="../style.css">
</head>

<body>

<header>
  <h1>Mandarin²</h1>
  <p>Flashcards | Clothes</p>
</header>

<main>

<div class="back-button">
  <a href="flashcards-unit-b.html">← Back to Unit B</a>
</div>

<section class="page-intro">
  <h2>Clothes Flashcards</h2>
  <p>Tap to flip. Swipe left/right to move. Mark hard words to review later.</p>
</section>

<section class="flashcard-container">

  <div class="flashcard-scene" onclick="flipCard()" id="flashScene">
    <div class="flashcard flip-card" id="card">
      <div class="flashcard-face flashcard-front">
        <div id="frontContent"></div>
      </div>
      <div class="flashcard-face flashcard-back">
        <div id="backContent"></div>
      </div>
    </div>
  </div>

  <div class="flashcard-controls">
    <button onclick="prevCard()">← Previous</button>
    <button onclick="flipCard()">Flip Card</button>
    <button onclick="nextCard()">Next →</button>
  </div>

  <div class="flashcard-controls">
    <button onclick="markHard()">⭐ Mark Hard</button>
    <button onclick="reviewHard()">Review Hard</button>
    <button onclick="resetAll()">Reset</button>
  </div>

  <p class="flash-progress" id="progress"></p>

</section>

</main>

<footer>
  <p>Mandarin²</p>
</footer>

<script>
let originalCards = [
  {han:"衣服", pin:"yī fu", eng:"clothes"},
  {han:"穿", pin:"chuān", eng:"to wear"},
  {han:"买", pin:"mǎi", eng:"to buy"},
  {han:"卖", pin:"mài", eng:"to sell"},
  {han:"试", pin:"shì", eng:"to try on"},
  {han:"衬衫", pin:"chèn shān", eng:"shirt"},
  {han:"T恤衫", pin:"T xù shān", eng:"T-shirt"},
  {han:"裤子", pin:"kù zi", eng:"trousers"},
  {han:"牛仔裤", pin:"niú zǎi kù", eng:"jeans"},
  {han:"裙子", pin:"qún zi", eng:"skirt"},
  {han:"连衣裙", pin:"lián yī qún", eng:"dress"},
  {han:"外套", pin:"wài tào", eng:"coat / jacket"},
  {han:"毛衣", pin:"máo yī", eng:"jumper / sweater"},
  {han:"鞋", pin:"xié", eng:"shoes"},
  {han:"运动鞋", pin:"yùn dòng xié", eng:"trainers"},
  {han:"袜子", pin:"wà zi", eng:"socks"},
  {han:"帽子", pin:"mào zi", eng:"hat"},
  {han:"颜色", pin:"yán sè", eng:"colour"},
  {han:"红色", pin:"hóng sè", eng:"red"},
  {han:"蓝色", pin:"lán sè", eng:"blue"},
  {han:"黑色", pin:"hēi sè", eng:"black"},
  {han:"白色", pin:"bái sè", eng:"white"},
  {han:"绿色", pin:"lǜ sè", eng:"green"},
  {han:"黄色", pin:"huáng sè", eng:"yellow"},
  {han:"粉红色", pin:"fěn hóng sè", eng:"pink"},
  {han:"大号", pin:"dà hào", eng:"large size"},
  {han:"小号", pin:"xiǎo hào", eng:"small size"},
  {han:"中号", pin:"zhōng hào", eng:"medium size"},
  {han:"合适", pin:"hé shì", eng:"suitable / fits"},
  {han:"太大", pin:"tài dà", eng:"too big"},
  {han:"太小", pin:"tài xiǎo", eng:"too small"},
  {han:"便宜", pin:"pián yi", eng:"cheap"},
  {han:"贵", pin:"guì", eng:"expensive"},
  {han:"漂亮", pin:"piào liang", eng:"pretty"},
  {han:"时髦", pin:"shí máo", eng:"fashionable"},
  {han:"舒服", pin:"shū fu", eng:"comfortable"},
  {han:"我喜欢穿蓝色的衣服", pin:"wǒ xǐ huān chuān lán sè de yī fu", eng:"I like wearing blue clothes"},
  {han:"这件衣服太贵了", pin:"zhè jiàn yī fu tài guì le", eng:"this item of clothing is too expensive"}
];

let cards = [];
let hardCards = [];
let index = 0;
let flipped = false;
let startX = 0;
let endX = 0;

function shuffle(array) {
  for (let i = array.length - 1; i > 0; i--) {
    let j = Math.floor(Math.random() * (i + 1));
    [array[i], array[j]] = [array[j], array[i]];
  }
  return array;
}

function initCards() {
  cards = shuffle([...originalCards]);
  index = 0;
  flipped = false;
  updateCard();
}

function updateCard() {
  const card = cards[index];

  document.getElementById("frontContent").innerHTML = `
    <div class="han">${card.han}</div>
    <div class="pin">${card.pin}</div>
  `;

  document.getElementById("backContent").innerHTML = `
    <div class="eng">${card.eng}</div>
  `;

  document.getElementById("card").classList.toggle("is-flipped", flipped);
  document.getElementById("progress").textContent =
    `Card ${index + 1} of ${cards.length} | Hard cards: ${hardCards.length}`;

  setTimeout(fitText, 0);
}

function fitText() {
  const elements = document.querySelectorAll(".han, .eng");

  elements.forEach(el => {
    el.style.fontSize = "";
    let size = parseFloat(window.getComputedStyle(el).fontSize);

    while (el.scrollWidth > el.clientWidth && size > 24) {
      size -= 2;
      el.style.fontSize = size + "px";
    }
  });
}

function flipCard() {
  flipped = !flipped;
  updateCard();
}

function animateCard(direction, callback) {
  const scene = document.getElementById("flashScene");

  scene.classList.remove("flashcard-slide-left", "flashcard-slide-right");
  void scene.offsetWidth;

  scene.classList.add(direction === "next" ? "flashcard-slide-left" : "flashcard-slide-right");

  setTimeout(function() {
    callback();
    scene.classList.remove("flashcard-slide-left", "flashcard-slide-right");
  }, 220);
}

function nextCard() {
  animateCard("next", function() {
    index = (index + 1) % cards.length;
    flipped = false;
    updateCard();
  });
}

function prevCard() {
  animateCard("prev", function() {
    index = (index - 1 + cards.length) % cards.length;
    flipped = false;
    updateCard();
  });
}

function markHard() {
  const current = cards[index];
  const exists = hardCards.some(card => card.han === current.han);
  if (!exists) hardCards.push(current);
  nextCard();
}

function reviewHard() {
  if (hardCards.length === 0) {
    alert("No hard cards yet.");
    return;
  }
  cards = shuffle([...hardCards]);
  index = 0;
  flipped = false;
  updateCard();
}

function resetAll() {
  hardCards = [];
  initCards();
}

const scene = document.getElementById("flashScene");

scene.addEventListener("touchstart", e => startX = e.touches[0].clientX);
scene.addEventListener("touchend", e => {
  endX = e.changedTouches[0].clientX;
  handleSwipe();
});

scene.addEventListener("mousedown", e => startX = e.clientX);
scene.addEventListener("mouseup", e => {
  endX = e.clientX;
  handleSwipe();
});

function handleSwipe() {
  const diff = endX - startX;

  if (Math.abs(diff) > 60) {
    if (diff < 0) nextCard();
    else prevCard();
  }
}

initCards();
</script>

</body>
</html>
