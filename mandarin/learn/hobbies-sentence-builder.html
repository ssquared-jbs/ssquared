<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Hobbies Sentence Builder | Mandarin²</title>
<link rel="stylesheet" href="../style.css">
</head>
<body>

<header>
  <h1>Mandarin²</h1>
  <p>Hobbies | Sentence Builder</p>
</header>

<main>

<div class="back-button">
  <a href="hobbies.html">← Back to Hobbies</a>
</div>

<section class="sentence-hero">
  <h2>Hobbies Sentence Builder</h2>
  <p>Practise building sentences about hobbies, sports, free time and performances.</p>
</section>

<section class="lesson-card">
  <h2>Mixed Practice</h2>
  <div id="questionArea"></div>

  <div class="results-box">
    <h3>Your Results</h3>
    <p>Total: <span id="totalQ">0</span></p>
    <p>Correct: <span id="correctQ">0</span></p>
    <p>Wrong: <span id="wrongQ">0</span></p>
    <p>Score: <span id="percentage">0%</span></p>
  </div>
</section>

<div class="bottom-buttons">
  <a href="hobbies.html">← Back to Topic</a>
</div>

</main>

<footer>
  <p>Mandarin²</p>
</footer>

<script>
let totalQuestions = 0;
let correctAnswers = 0;
let wrongAnswers = 0;

const questions = [
  { type: "mcq", q: "What does 爱好 mean?", options: ["Hobby", "Film", "Sport"], correct: "Hobby" },
  { type: "mcq", q: "What does 电影 mean?", options: ["Film", "TV", "Photo"], correct: "Film" },
  { type: "mcq", q: "What does 上网 mean?", options: ["Go online", "Go shopping", "Watch TV"], correct: "Go online" },

  { type: "fill", q: "我的 ____ 是看电影。", options: ["爱好", "照片", "广告"], correct: "爱好" },
  { type: "fill", q: "我喜欢 ____ 电视。", options: ["看", "写", "去"], correct: "看" },
  { type: "fill", q: "我会写 ____。", options: ["书法", "电影", "网球"], correct: "书法" },

  { type: "type", q: "Type the Chinese for: hobby", correct: "爱好" },
  { type: "type", q: "Type the Chinese for: film", correct: "电影" },
  { type: "type", q: "Type the Chinese for: football", correct: "足球" },

  { type: "order", q: "Build: My hobby is watching films.", words: ["我的爱好", "是", "看电影"], correct: "我的爱好是看电影" },
  { type: "order", q: "Build: I like going online.", words: ["我", "喜欢", "上网"], correct: "我喜欢上网" },
  { type: "order", q: "Build: I often run.", words: ["我", "常常", "跑步"], correct: "我常常跑步" },
  { type: "order", q: "Build: I like martial arts because it is very interesting.", words: ["我喜欢武术", "因为", "非常有意思"], correct: "我喜欢武术因为非常有意思" },

  { type: "mcq", q: "Which sentence means: I can write calligraphy?", options: ["我会写书法。", "我会看电影。", "我会打网球。"], correct: "我会写书法。" },
  { type: "mcq", q: "Which sentence means: I sometimes read books?", options: ["我有时候看书。", "我总是看电视。", "我常常跑步。"], correct: "我有时候看书。" },
  { type: "mcq", q: "Which sentence means: I like playing football?", options: ["我喜欢踢足球。", "我喜欢打篮球。", "我喜欢打网球。"], correct: "我喜欢踢足球。" }
];

function shuffle(array) {
  for (let i = array.length - 1; i > 0; i--) {
    const randomIndex = Math.floor(Math.random() * (i + 1));
    const temp = array[i];
    array[i] = array[randomIndex];
    array[randomIndex] = temp;
  }
  return array;
}

function safe(text) {
  return text.replace(/'/g, "\\'");
}

function loadQuestions() {
  const area = document.getElementById("questionArea");
  const shuffledQuestions = shuffle([...questions]);
  area.innerHTML = "";

  shuffledQuestions.forEach(function(question, index) {
    area.innerHTML += buildQuestion(question, index);
  });
}

function buildQuestion(question, index) {
  if (question.type === "mcq") {
    const options = shuffle([...question.options]);
    const letters = ["A", "B", "C"];

    return `
      <div class="fill-question">
        <h3>Question ${index + 1}</h3>
        <p>${question.q}</p>
        <div class="quiz-buttons">
          ${options.map(function(option, i) {
            return `
              <button onclick="checkAnswer(this, '${safe(option)}', '${safe(question.correct)}')">
                <strong>${letters[i]}.</strong> ${option}
              </button>
            `;
          }).join("")}
        </div>
        <p class="feedback"></p>
      </div>
    `;
  }

  if (question.type === "fill") {
    const options = shuffle([...question.options]);

    return `
      <div class="fill-question">
        <h3>Question ${index + 1}</h3>
        <p class="chinese">${question.q}</p>
        <div class="quiz-buttons">
          ${options.map(function(option) {
            return `
              <button onclick="checkAnswer(this, '${safe(option)}', '${safe(question.correct)}')">
                ${option}
              </button>
            `;
          }).join("")}
        </div>
        <p class="feedback"></p>
      </div>
    `;
  }

  if (question.type === "type") {
    return `
      <div class="fill-question">
        <h3>Question ${index + 1}</h3>
        <p>${question.q}</p>
        <input class="type-answer" type="text" placeholder="Type your answer here">
        <button class="continue-btn" onclick="checkTypedAnswer(this, '${safe(question.correct)}')">Check answer</button>
        <p class="feedback"></p>
      </div>
    `;
  }

  if (question.type === "order") {
    const words = shuffle([...question.words]);
    const builderId = "builder" + index;
    const bankId = "bank" + index;

    return `
      <div class="fill-question">
        <h3>Question ${index + 1}</h3>
        <p>${question.q}</p>

        <div class="word-bank" id="${bankId}">
          ${words.map(function(word) {
            return `<button onclick="addWord(this, '${builderId}')">${word}</button>`;
          }).join("")}
        </div>

        <div class="sentence-drop" id="${builderId}"></div>

        <button class="continue-btn" onclick="checkOrder('${builderId}', '${safe(question.correct)}')">Check sentence</button>
        <button class="reset-btn" onclick="resetOrder('${builderId}', '${bankId}')">Reset</button>

        <p class="feedback" id="${builderId}-feedback"></p>
      </div>
    `;
  }
}

function checkAnswer(button, selected, correct) {
  const box = button.closest(".fill-question");
  const buttons = box.querySelectorAll(".quiz-buttons button");
  const feedback = box.querySelector(".feedback");

  buttons.forEach(function(btn) {
    btn.disabled = true;
    if (btn.textContent.includes(correct)) {
      btn.classList.add("correct-answer");
    }
  });

  markQuestion(selected === correct, feedback, button);
}

function checkTypedAnswer(button, correct) {
  const box = button.closest(".fill-question");
  const input = box.querySelector(".type-answer");
  const feedback = box.querySelector(".feedback");
  const answer = input.value.trim();

  input.disabled = true;
  button.disabled = true;

  markQuestion(answer === correct, feedback, button);
}

function addWord(button, builderId) {
  const builder = document.getElementById(builderId);
  const word = document.createElement("span");
  word.textContent = button.textContent;
  word.className = "chosen-word";
  builder.appendChild(word);
  button.style.display = "none";
}

function checkOrder(builderId, correct) {
  const builder = document.getElementById(builderId);
  const feedback = document.getElementById(builderId + "-feedback");

  const answer = Array.from(builder.children)
    .map(function(word) {
      return word.textContent;
    })
    .join("");

  markQuestion(answer === correct, feedback, builder);
}

function resetOrder(builderId, bankId) {
  const builder = document.getElementById(builderId);
  const bank = document.getElementById(bankId);
  const feedback = document.getElementById(builderId + "-feedback");

  builder.innerHTML = "";
  feedback.textContent = "";
  builder.classList.remove("correct-answer");
  builder.classList.remove("wrong-answer");

  bank.querySelectorAll("button").forEach(function(button) {
    button.style.display = "inline-block";
  });
}

function markQuestion(isCorrect, feedback, element) {
  totalQuestions++;

  if (isCorrect) {
    correctAnswers++;
    feedback.textContent = "Correct.";
    feedback.className = "feedback correct-feedback";
    element.classList.add("correct-answer");
  } else {
    wrongAnswers++;
    feedback.textContent = "Not quite.";
    feedback.className = "feedback wrong-feedback";
    element.classList.add("wrong-answer");
  }

  updateResults();
}

function updateResults() {
  document.getElementById("totalQ").textContent = totalQuestions;
  document.getElementById("correctQ").textContent = correctAnswers;
  document.getElementById("wrongQ").textContent = wrongAnswers;

  let percent = 0;

  if (totalQuestions > 0) {
    percent = Math.round((correctAnswers / totalQuestions) * 100);
  }

  document.getElementById("percentage").textContent = percent + "%";
}

loadQuestions();
</script>

</body>
</html>
