<!DOCTYPE html>
<html lang="en">
<head>
      <!-- Google tag + AdSense -->
<script async src="https://www.googletagmanager.com/gtag/js?id=G-73KC2J774N"></script>

<script async src="https://pagead2.googlesyndication.com/pagead/js/adsbygoogle.js?client=ca-pub-5555086410809788"
  crossorigin="anonymous"></script>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Lamb B</title>

    <style>
        * {
            box-sizing: border-box;
        }

        html,
        body {
            margin: 0;
            padding: 0;
            width: 100%;
            height: 100%;
        }

        body {
            font-family: Arial, Helvetica, sans-serif;
            background: #000;
            color: #fff;
            overflow: hidden;

            display: flex;
            align-items: center;
            justify-content: center;

            position: relative;
        }

        /* Main red background accents */
        .red-glow-top {
            position: fixed;
            top: -300px;
            left: -300px;
            width: 700px;
            height: 700px;
            border-radius: 50%;
            background: #7d0000;
            opacity: 0.35;
            pointer-events: none;
        }

        .red-glow-bottom {
            position: fixed;
            bottom: -350px;
            right: -300px;
            width: 750px;
            height: 750px;
            border-radius: 50%;
            background: #8b0000;
            opacity: 0.3;
            pointer-events: none;
        }

        /* Very small yellow Lamb B accent */
        .yellow-line {
            position: fixed;
            bottom: 0;
            left: 0;
            width: 100%;
            height: 3px;
            background: #d4af37;
        }

        /* Lamb B lion */
        .lamb-lion {
            position: fixed;
            top: 15px;
            right: 15px;

            width: 40px;
            height: 40px;

            object-fit: contain;
            display: block;

            z-index: 20;
        }

        /* Login box */
        .login-box {
            position: relative;
            z-index: 10;

            width: 500px;
            max-width: 90%;

            padding: 60px 55px;

            background: #080808;

            border: 2px solid #8b0000;
            border-top: 5px solid #b00000;

            box-shadow:
                0 0 0 1px #1a1a1a,
                0 0 50px rgba(139, 0, 0, 0.45);

            text-align: center;
        }

        /* Yellow detail */
        .crest-line {
            width: 45px;
            height: 3px;

            margin: 0 auto 25px;

            background: #d4af37;
        }

        .login-box h1 {
            margin: 0;

            font-size: 32px;
            font-weight: 700;

            letter-spacing: 6px;
            text-transform: uppercase;
        }

        .login-box p {
            margin: 14px 0 32px;

            color: #888;

            font-size: 13px;
            letter-spacing: 1px;
        }

        /* Password input */
        #password {
            width: 100%;
            height: 52px;

            padding: 0 16px;

            background: #000;

            border: 1px solid #444;

            color: #fff;

            outline: none;

            font-size: 15px;
            text-align: center;

            transition: border-color 0.2s;
        }

        #password:focus {
            border-color: #b00000;
        }

        #password::placeholder {
            color: #555;
        }

        /* Enter button */
        .enter-button {
            width: 100%;
            height: 52px;

            margin-top: 14px;

            border: none;

            background: #8b0000;

            color: #fff;

            font-size: 13px;
            font-weight: bold;

            letter-spacing: 4px;

            cursor: pointer;

            transition: background 0.2s, transform 0.1s;
        }

        .enter-button:hover {
            background: #b00000;
        }

        .enter-button:active {
            transform: scale(0.98);
        }

        /* Error message */
        #error {
            height: 20px;

            margin-top: 15px;

            color: #d4af37;

            font-size: 12px;
            letter-spacing: 0.5px;
        }

        /* Mobile */
        @media (max-width: 600px) {
            .login-box {
                padding: 45px 30px;
            }

            .login-box h1 {
                font-size: 26px;
            }
        }
    </style>
</head>

<body>

    <!-- Background -->
    <div class="red-glow-top"></div>
    <div class="red-glow-bottom"></div>

    <!-- Lamb B lion -->
    <img
        class="lamb-lion"
        src="../images/lamb-b-lion.jpg"
        alt="Lamb B"
    >

    <!-- Login -->
    <div class="login-box">

        <div class="crest-line"></div>

        <h1>Lamb B</h1>

        <p>ENTER PASSWORD TO CONTINUE</p>

        <input
            type="password"
            id="password"
            placeholder="Password"
            autocomplete="off"
        >

        <button
            class="enter-button"
            onclick="checkPassword()"
        >
            ENTER
        </button>

        <div id="error"></div>

    </div>

    <!-- Tiny yellow accent -->
    <div class="yellow-line"></div>


    <script>
        function checkPassword() {

            const password =
                document.getElementById("password").value;

            const error =
                document.getElementById("error");

            if (password === "lambarchbold1959") {

                window.location.href = "home.html";

            } else {

                error.textContent = "Incorrect password.";

                document.getElementById("password").value = "";

                document.getElementById("password").focus();
            }
        }


        document
            .getElementById("password")
            .addEventListener("keydown", function(event) {

                if (event.key === "Enter") {
                    checkPassword();
                }

            });
    </script>

</body>
</html>
